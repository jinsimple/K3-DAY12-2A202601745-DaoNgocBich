# CP5 — Cấu hình deploy Railway (dùng nếu bạn chọn Railway).
#
# Các biến môi trường KHÔNG khai báo ở đây. Đặt chúng trong dashboard hoặc:
#     railway variables --set AGENT_API_KEY=...
#
# Railway tự gán biến PORT — app phải đọc $PORT, đừng cố định 8000.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Không đặt startCommand: Railway tự dùng CMD trong Dockerfile, vốn đã chạy
# qua shell (`sh -c "... --port ${PORT:-8000}"`) nên $PORT được expand đúng.
# startCommand ở đây chạy KHÔNG qua shell — $PORT bị truyền nguyên văn dưới
# dạng chuỗi "$PORT" cho uvicorn, gây lỗi "Invalid value for '--port'".
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
