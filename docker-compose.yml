# ═══════════════════════════════════════════════════════════════════
# CP2 — Stack chạy ở máy bạn: redis + agent + nginx (load balancer, điểm cộng).
#
# `agent` không map cổng ra host — chỉ `expose` nội bộ trong mạng compose.
# Lý do: `docker compose up --scale agent=3` tạo nhiều container cùng service,
# tất cả cùng đòi cổng host 8000 nếu dùng `ports:` sẽ đụng nhau ngay lập tức.
# `nginx` là cửa duy nhất ra ngoài (host 8000 → nginx 80 → round-robin các
# `agent`), cấu hình sẵn ở nginx/nginx.conf.
#
# Kiểm tra: pytest tests/test_cp2.py -v
# ═══════════════════════════════════════════════════════════════════

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Không map "8000:8000" ra host: khi `--scale agent=3`, 3 container cùng
  # đòi cổng 8000 trên host sẽ đụng nhau. `expose` chỉ mở cổng nội bộ trong
  # mạng compose — Nginx bên dưới là cửa duy nhất ra ngoài.
  agent:
    build: .
    expose:
      - "8000"
    environment:
      AGENT_API_KEY: ${AGENT_API_KEY:?set AGENT_API_KEY in .env}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; port = os.getenv('PORT', '8000'); urllib.request.urlopen(f'http://127.0.0.1:{port}/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ĐIỂM CỘNG: load balancer cho `docker compose up --scale agent=3`.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agent

volumes:
  redis-data:
